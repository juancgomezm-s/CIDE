name: Remote validation (explicit manual request only)

# Local checks: python scripts/check-local.py
# Push/PR never authorizes remote CI, including M5.
# Dispatch/rerun only for a separate explicit owner request for that run.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: 1.88.0
          components: rustfmt, clippy
      # Only this explicitly requested remote run may provision its crate cache.
      - run: cargo fetch --locked
      - run: python scripts/check-local.py
