[package]
name = "jc-progress"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "Explicit process and byte-safe result protocol for the CIDE ABL bridge"
publish = false

[dependencies]
jc-app = { path = "../jc-app", optional = true }
jc-languages = { path = "../jc-languages", optional = true }
jc-text = { path = "../jc-text", optional = true }

[features]
source-services = ["dep:jc-app", "dep:jc-languages", "dep:jc-text"]
