[package]
name = "jc-cli"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
publish = false
default-run = "cide"
description = "Headless validation CLI for the CIDE prototype"

[[bin]]
name = "cide"
path = "src/main.rs"

[[bin]]
name = "jc-ide"
path = "src/legacy_main.rs"
test = false
bench = false

[dependencies]
jc-core = { path = "../jc-core" }
jc-languages = { path = "../jc-languages" }
jc-progress = { path = "../jc-progress" }
