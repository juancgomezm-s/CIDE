[package]
name = "jc-gui"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
publish = false
default-run = "cide-gui"
description = "Native Windows frontend sharing the CIDE application model"

[dependencies]
jc-fs = { path = "../jc-fs" }
jc-platform = { path = "../jc-platform" }
jc-app = { path = "../jc-app" }
jc-text = { path = "../jc-text" }
jc-progress = { path = "../jc-progress", features = ["source-services"] }

[target.'cfg(windows)'.dependencies]
serde_json = "=1.0.145"
sha2 = "=0.11.1"
tempfile = "=3.27.0"

[[bin]]
name = "cide-gui"
path = "src/main.rs"

[[bin]]
name = "jc-ide-gui"
path = "src/legacy_main.rs"
test = false
bench = false
