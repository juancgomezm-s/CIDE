[package]
name = "jc-gui"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
publish = false
default-run = "cide-gui"
description = "Native Windows frontend sharing the CIDE application model"

[dependencies]
jc-platform = { path = "../jc-platform" }
jc-app = { path = "../jc-app" }
jc-text = { path = "../jc-text" }

[[bin]]
name = "cide-gui"
path = "src/main.rs"

[[bin]]
name = "jc-ide-gui"
path = "src/legacy_main.rs"
test = false
bench = false
