[package]
name = "jc-tui"
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
publish = false
description = "Keyboard-first terminal frontend for JC-IDE"

[[bin]]
name = "jc-ide-tui"
path = "src/main.rs"

[dependencies]
crossterm = { version = "=0.29.0", default-features = false, features = ["bracketed-paste", "events", "windows"] }
jc-app = { path = "../jc-app" }
jc-languages = { path = "../jc-languages" }
jc-text = { path = "../jc-text" }
