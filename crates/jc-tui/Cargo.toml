[package]
name = "jc-tui"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
publish = false
default-run = "cide-tui"
description = "Keyboard-first terminal frontend for CIDE"

[[bin]]
name = "cide-tui"
path = "src/main.rs"

[[bin]]
name = "jc-ide-tui"
path = "src/legacy_main.rs"
test = false
bench = false

[dependencies]
crossterm = { version = "=0.29.0", default-features = false, features = ["bracketed-paste", "events", "windows"] }
jc-app = { path = "../jc-app" }
jc-languages = { path = "../jc-languages" }
jc-text = { path = "../jc-text" }
jc-progress = { path = "../jc-progress", features = ["source-services"] }

jc-platform = { path = "../jc-platform" }
