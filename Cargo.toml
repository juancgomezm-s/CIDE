[workspace]
members = [
    "crates/jc-core",
    "crates/jc-text",
    "crates/jc-files",
    "crates/jc-languages",
    "crates/jc-progress",
    "crates/jc-app",
    "crates/jc-tui",
    "crates/jc-gui",
    "crates/jc-cli",
    "crates/jc-platform",
]
resolver = "2"

[profile.release]
opt-level = "s"
lto = "thin"
codegen-units = 1
strip = "debuginfo"
